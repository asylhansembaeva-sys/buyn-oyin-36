<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Буынды оқы да, үстін бас!</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Times New Roman',serif;background:linear-gradient(#55c9ff 0%,#c5efff 54%,#a8e97a 75%,#53bf50 100%);color:#111}.wrap{max-width:1510px;margin:auto;padding:14px 16px 25px}.header{border:5px solid #1673bf;background:#fff28a;border-radius:35px;text-align:center;padding:8px 12px;box-shadow:0 5px 0 #ffffff88}.header h1{font-size:clamp(27px,4.2vw,64px);margin:0;font-weight:900;line-height:1.12}.header p{font-size:clamp(23px,3.4vw,45px);font-weight:900;color:#123ce1;margin:2px 0}.status{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:clamp(18px,2vw,27px);font-weight:bold;margin:12px 4px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.tile{font-family:'Times New Roman',serif;font-size:clamp(36px,3.1vw,43px);font-weight:900;color:#050505;min-height:104px;border:4px solid #ffffff70;border-radius:22px;cursor:pointer;box-shadow:inset 0 3px 0 #ffffffa0,0 4px 0 #00000016;transition:opacity .18s,transform .18s}.tile:nth-child(5n+1){background:#ffb2d9;border-color:#f17cbb}.tile:nth-child(5n+2){background:#ffeb79;border-color:#ffc522}.tile:nth-child(5n+3){background:#a7f48b;border-color:#60d948}.tile:nth-child(5n+4){background:#a4e4ff;border-color:#55bff0}.tile:nth-child(5n){background:#d4a2f7;border-color:#b476ef}.tile:active{transform:scale(.95)}.tile.gone{visibility:hidden;pointer-events:none}.controls{text-align:center;margin:22px auto}.action{font-family:'Times New Roman',serif;font-size:clamp(27px,3.5vw,48px);font-weight:900;background:linear-gradient(#ff5a55,#e50909);color:#fff;border:5px solid white;border-radius:30px;padding:10px 50px;box-shadow:0 4px 0 #b90c0c;cursor:pointer}.message{display:none;position:fixed;inset:0;background:#071d4a88;z-index:5;align-items:center;justify-content:center;padding:18px}.message.show{display:flex}.panel{background:#fff4a0;border:7px solid #1d87da;border-radius:35px;padding:35px 28px;text-align:center;max-width:680px;width:100%;box-shadow:0 14px 30px #0003}.panel h2{font-size:clamp(40px,7vw,76px);margin:0 0 12px;color:#0a5fb9}.panel p{font-size:clamp(25px,4vw,42px);font-weight:bold;margin:0 0 25px}@media(max-width:700px){.wrap{padding:9px 7px 15px}.header{border-width:3px;border-radius:18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{min-height:70px;font-size:clamp(36px,8vw,43px);border-width:3px;border-radius:14px}.status{font-size:19px;margin:10px 2px}.action{padding:9px 32px;border-radius:22px}}
</style></head><body><main class="wrap"><header class="header"><h1>Буынды оқы да, үстін бас — буын жоғалады!</h1><p>Дайын болсаң, баста!</p></header><div class="status"><span id="count">Оқылған буын: 0 / 36</span><span id="hint">Алдымен «БАСТА!» басыңыз</span></div><section class="grid" id="grid" aria-label="36 буын"></section><div class="controls"><button class="action" id="start">БАСТА!</button></div></main><div class="message" id="done"><div class="panel"><h2>🌟 ЖАРАЙСЫҢ!</h2><p>Барлық 36 буынды оқыдың!</p><button class="action" id="again">ҚАЙТА ОЙНАУ</button></div></div><script>
const pairs=[['ар','ра'],['ал','ла'],['ас','са'],['ат','та'],['ақ','қа'],['ан','на'],['аз','за'],['ем','ме'],['ад','да'],['аш','ша'],['ор','ро'],['ол','ло'],['ос','со'],['от','то'],['оқ','қо'],['ұн','нұ'],['ұр','рұ'],['ыс','сы']];const syllables=pairs.flat();let started=false,remaining=36;const grid=document.getElementById('grid'),count=document.getElementById('count'),hint=document.getElementById('hint'),done=document.getElementById('done'),start=document.getElementById('start');function render(){grid.innerHTML='';remaining=36;count.textContent='Оқылған буын: 0 / 36';syllables.forEach(s=>{const b=document.createElement('button');b.className='tile';b.textContent=s;b.type='button';b.setAttribute('aria-label',s);b.addEventListener('click',()=>{if(!started||b.classList.contains('gone'))return;b.classList.add('gone');remaining--;count.textContent='Оқылған буын: '+(36-remaining)+' / 36';if(remaining===0){started=false;setTimeout(()=>done.classList.add('show'),260)}});grid.appendChild(b)})}function begin(){render();started=true;hint.textContent='Буындарды басып оқыңыз';start.textContent='ҚАЙТА БАСТАУ';done.classList.remove('show')}start.addEventListener('click',begin);document.getElementById('again').addEventListener('click',begin);render();
</script></body></html>
